<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Midnight Thoughts</title>

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- STARS -->
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <!-- BACKGROUND GLOW -->
  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>
  <div class="bg-circle circle-3"></div>

  <!-- LOCK SCREEN -->
  <div id="lockScreen">

    <div class="lock-box glass">

      <h2>Midnight Thoughts 🌙</h2>

      <p>Enter your secret password</p>

      <input
        type="password"
        id="passwordInput"
        placeholder="Enter password"
      >

      <button id="unlockBtn">
        Unlock Journal
      </button>

      <button id="resetPasswordBtn">
  Reset Password
</button>

      <p id="lockMessage"></p>

    </div>

  </div>

  <!-- MUSIC -->
  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mp3">
  </audio>

  <!-- MUSIC CARD -->
  <div id="musicCard">

    <div class="music-left">
      🎵
    </div>

    <div class="music-right">

      <p class="music-title">
        Midnight Lofi
      </p>

      <button id="musicToggle">
        Play Music
      </button>

    </div>

  </div>

  <!-- MAIN -->
  <main class="container">

    <!-- QUOTE -->
    <div class="quote-box glass">

      <p id="quoteText">
        “Some thoughts only visit after midnight.”
      </p>

    </div>

    <!-- TITLE -->
    <h1 class="title">
      Midnight Thoughts 🌙
    </h1>

    <!-- SEARCH -->
    <input
      id="searchInput"
      placeholder="Search thoughts..."
    />

    <!-- TAGS -->
    <div class="tags">

      <button class="tag" data-tag="love">
        ❤️ Love
      </button>

      <button class="tag" data-tag="sad">
        💔 Sad
      </button>

      <button class="tag" data-tag="study">
        📚 Study
      </button>

      <button class="tag" data-tag="random">
        ✨ Random
      </button>

    </div>

    <!-- EXTRA FEATURES -->
    <div class="extras">

      <button id="exportBtn">
        Export Thoughts
      </button>

      <button id="mirrorBtn">
        Mirror Thoughts
      </button>

    </div>

    <!-- AUDIO NOTES -->
    <div class="audio-box glass">

      <h3>🎧 Voice Notes</h3>

      <button id="recordBtn">
        Start Recording
      </button>

    </div>

    <!-- INPUT -->
    <section class="input-card glass">

      <textarea
        id="thoughtInput"
        placeholder="What’s haunting your mind tonight...?"
      ></textarea>

      <button id="saveBtn">
        Save Thought
      </button>

      <p id="feedback"></p>

    </section>

    <!-- MOOD -->
    <div class="mood-selector">

      <button class="mood-btn active" data-mood="normal">
        🌙
      </button>

      <button class="mood-btn" data-mood="happy">
        😊
      </button>

      <button class="mood-btn" data-mood="sad">
        😔
      </button>

      <button class="mood-btn" data-mood="lonely">
        🌧
      </button>

    </div>

    <!-- THOUGHTS -->
    <section class="thoughts-section">

      <div id="emptyState" class="glass empty-state">
        <p>No thoughts saved yet...</p>
      </div>

      <div id="thoughtsContainer"></div>

    </section>

  </main>

  <!-- JS -->
 <script defer src="script.js"></script>

</body>
</html>
